services:
  deluge:
    image: local/deluge-dark:2.2.0
    build:
      context: .
      args:
        DELUGE_IMAGE: ${DELUGE_IMAGE:-lscr.io/linuxserver/deluge:2.2.0}
        WEB_DIR: ${WEB_DIR:-/lsiopy/lib/python3.12/site-packages/deluge/ui/web}
    container_name: deluge
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      DELUGE_LOGLEVEL: ${DELUGE_LOGLEVEL:-info}
    volumes:
      - ${DELUGE_ROOT:-/opt/deluge}/config:/config
      - ${DOWNLOAD_DIR:-/mnt/downloads}:/downloads
    ports:
      - "127.0.0.1:${WEB_PORT:-8112}:8112"

    expose:
      - "6881"
      - "6881/udp"
    read_only: true
    tmpfs:
      - /run:rw,exec,nosuid,nodev,size=16m,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.80
    pids_limit: 256
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    image: local/torrentflix-nginx:latest
    container_name: torrentflix-nginx
    depends_on:
      - deluge
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_acme_state:/var/cache/nginx/acme/state
      - ./nginx/www:/www:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d.runtime:/etc/nginx/conf.d:ro
    tmpfs:
      - /var/run:rw,nosuid,nodev,noexec,size=16m
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=64m
      - /tmp:rw,nosuid,nodev,noexec,size=32m
      - /var/log/nginx:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null && nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  nginx_acme_state:
    name: torrentflix_nginx_acme_state
