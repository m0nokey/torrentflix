services:
  nginx:
    build:
      context: .
    image: ${NGINX_IMAGE:-local/nginx:latest}
    container_name: nginx
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_acme_state:/var/cache/nginx/acme/state
      - ./www:/www:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_CONF_DIR:-./conf.d}:/etc/nginx/conf.d:ro
    tmpfs:
      - /var/run:rw,nosuid,nodev,noexec,size=16m
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=64m
      - /tmp:rw,nosuid,nodev,noexec,size=32m
      - /var/log/nginx:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CAP_DAC_READ_SEARCH
      - CAP_DAC_OVERRIDE
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: ${NGINX_MEMORY:-256m}
    memswap_limit: ${NGINX_MEMORY:-256m}
    cpus: ${NGINX_CPUS:-1.0}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default
      - edge

networks:
  edge:
    external: true

volumes:
  nginx_acme_state:
    name: nginx_acme_state
    external: true
