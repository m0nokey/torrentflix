services:
  deluge:
    image: local/deluge-dark:2.2.0
    build:
      context: .
      args:
        DELUGE_IMAGE: ${DELUGE_IMAGE:-lscr.io/linuxserver/deluge:2.2.0@sha256:33a939576f7ecfc1227db1a0cb2afce030ce983e620ec9d93c956e3700e21fe9}
        WEB_DIR: ${WEB_DIR:-/lsiopy/lib/python3.12/site-packages/deluge/ui/web}
    container_name: deluge
    environment:
      PUID: ${DELUGE_UID:-1000}
      PGID: ${DELUGE_GID:-1000}
      TZ: ${TZ:-Etc/UTC}
      DELUGE_LOGLEVEL: ${DELUGE_LOGLEVEL:-info}
    volumes:
      - ${DELUGE_CONFIG_DIR:-/opt/torrentflix/deluge/config}:/config
      - ${DOWNLOAD_DIR:-/srv/torrentflix/downloads}:/downloads
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-8112}:8112"

    expose:
      - "6881"
      - "6881/udp"
    read_only: true
    tmpfs:
      - /run:rw,exec,nosuid,nodev,size=16m,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.80
    pids_limit: 256
    restart: unless-stopped
