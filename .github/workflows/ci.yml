name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code_changed: ${{ steps.changed.outputs.code_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == pull_request ]]; then
              base_sha="$BASE_SHA"
          else
              base_sha="$BEFORE_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse "$HEAD_SHA^")"
          fi

          code_changed=false

          while IFS= read -r changed_file; do
              if [[ "$changed_file" != README.md ]]; then
                  code_changed=true
                  break
              fi
          done < <(git diff --name-only "$base_sha" "$HEAD_SHA")

          printf 'code_changed=%s\n' "$code_changed" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' script_file; do
              shellcheck --severity=error "$script_file"
              bash -n "$script_file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: Validate Compose files
        run: |
          docker compose -f deluge/compose.yml config --quiet
          docker compose -f deluge/compose.vps.yml config --quiet
          docker compose -f plex/compose.yml config --quiet
          vps_rendered="$(docker compose -f deluge/compose.vps.yml config)"
          grep -q 'PUID: "10001"' <<< "$vps_rendered"
          grep -q 'PGID: "10000"' <<< "$vps_rendered"

          local_rendered="$(DELUGE_UID=1234 DELUGE_GID=1234 docker compose \
            -f deluge/compose.yml config)"
          grep -q 'PUID: "1234"' <<< "$local_rendered"
          grep -q 'PGID: "1234"' <<< "$local_rendered"

          plex_rendered="$(PLEX_UID=10002 PLEX_GID=10000 docker compose \
            -f plex/compose.yml config)"
          grep -q 'PLEX_UID: "10002"' <<< "$plex_rendered"
          grep -q 'PLEX_GID: "10000"' <<< "$plex_rendered"

          lan_rendered="$(docker compose -f deluge/compose.yml config)"
          vps_rendered="$(docker compose -f deluge/compose.vps.yml config)"
          test "$(grep -c 'target: 6881' <<< "$lan_rendered")" -eq 0
          test "$(grep -c 'target: 6881' <<< "$vps_rendered")" -eq 0
          grep -q 'expose:' <<< "$lan_rendered"
          grep -q 'expose:' <<< "$vps_rendered"
          grep -q '/mnt/plexmedia:ro' <<< "$plex_rendered" || grep -q 'read_only: true' <<< "$plex_rendered"
          ! grep -Eq 'published: (6881|[0-9]+).*target: 6881|target: 6881.*published:' <<< "$lan_rendered"
          ! grep -Eq 'published: (6881|[0-9]+).*target: 6881|target: 6881.*published:' <<< "$vps_rendered"

  build:
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    needs:
      - changes
      - validate
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Prepare pinned Deluge theme
        shell: bash
        run: |
          set -euo pipefail
          theme_dir="$RUNNER_TEMP/deluge-theme"
          archive="$RUNNER_TEMP/deluge-theme.tar.gz"
          mkdir -p "$theme_dir"
          curl -fsSL \
            'https://raw.githubusercontent.com/joelacus/deluge-web-dark-theme/dbef18e3c9a2cb0f2448d16bb95dca868f94440e/deluge_web_dark_theme.tar.gz' \
            -o "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = \
            '5c3e6a4453fb06c16bc89f3b3789f12ba56b01addc111477211cb63e93f291bb'
          tar -xzf "$archive" -C "$theme_dir"
          cp -a "$theme_dir" deluge/theme

      - name: Build Deluge image
        run: docker build --pull -f deluge/Dockerfile -t torrentflix-ci-deluge deluge

      - name: Build bundled Nginx image
        run: docker build --pull -f deluge/nginx/Dockerfile -t torrentflix-ci-nginx deluge/nginx

  smoke:
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    needs:
      - changes
      - validate
      - build
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run container smoke tests
        shell: bash
        run: |
          set -euo pipefail

          smoke_root="$RUNNER_TEMP/torrentflix-smoke"
          lan_project='torrentflix-smoke-lan'
          vps_project='torrentflix-smoke-vps'
          plex_project='torrentflix-smoke-plex'
          theme_commit='dbef18e3c9a2cb0f2448d16bb95dca868f94440e'
          theme_sha256='5c3e6a4453fb06c16bc89f3b3789f12ba56b01addc111477211cb63e93f291bb'

          wait_for_http() {
              local url="$1"
              local attempts="$2"
              local delay="$3"
              local attempt
              local status

              for ((attempt = 1; attempt <= attempts; attempt++)); do
                  if status="$(curl \
                      --silent \
                      --show-error \
                      --output /dev/null \
                      --write-out '%{http_code}' \
                      "$url")"; then
                      printf '[smoke] GET %s -> HTTP %s (attempt %s/%s)\n' \
                          "$url" "$status" "$attempt" "$attempts"

                      if [[ "$status" =~ ^[23][0-9]{2}$ ]]; then
                          return 0
                      fi
                  else
                      printf '[smoke] GET %s -> connection failed (attempt %s/%s)\n' \
                          "$url" "$attempt" "$attempts"
                  fi

                  sleep "$delay"
              done

              return 1
          }

          wait_for_container_http() {
              local container_name="$1"
              local url="$2"
              local attempts="$3"
              local delay="$4"
              local attempt
              local status

              for ((attempt = 1; attempt <= attempts; attempt++)); do
                  if status="$(docker exec "$container_name" \
                      curl \
                      --silent \
                      --show-error \
                      --output /dev/null \
                      --write-out '%{http_code}' \
                      "$url")"; then
                      printf '[smoke] GET %s via %s -> HTTP %s (attempt %s/%s)\n' \
                          "$url" "$container_name" "$status" "$attempt" "$attempts"

                      if [[ "$status" =~ ^[23][0-9]{2}$ ]]; then
                          return 0
                      fi
                  else
                      printf '[smoke] GET %s via %s -> connection failed (attempt %s/%s)\n' \
                          "$url" "$container_name" "$attempt" "$attempts"
                  fi

                  sleep "$delay"
              done

              return 1
          }

          wait_for_container_health() {
              local container_name="$1"
              local attempts="$2"
              local delay="$3"
              local health_status
              local attempt

              for ((attempt = 1; attempt <= attempts; attempt++)); do
                  health_status="$(docker inspect \
                      --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                      "$container_name" 2>/dev/null || true)"
                  printf '[smoke] %s health -> %s (attempt %s/%s)\n' \
                      "$container_name" "$health_status" "$attempt" "$attempts"

                  if [[ "$health_status" == healthy ]]; then
                      return 0
                  fi

                  sleep "$delay"
              done

              printf 'Container did not become healthy: %s (%s)\n' \
                  "$container_name" "$health_status" >&2
              return 1
          }

          assert_running() {
              local container_name="$1"
              local running
              local restart_count

              running="$(docker inspect --format '{{.State.Running}}' "$container_name")"
              restart_count="$(docker inspect --format '{{.RestartCount}}' "$container_name")"

              if [[ "$running" != true ]]; then
                  printf 'Container is not running: %s\n' "$container_name" >&2
                  return 1
              fi

              if [[ "$restart_count" != 0 ]]; then
                  printf 'Container restarted during smoke test: %s (%s)\n' "$container_name" "$restart_count" >&2
                  return 1
              fi
          }

          prepare_theme() {
              local archive_file="$RUNNER_TEMP/deluge-theme.tar.gz"
              local theme_dir="$GITHUB_WORKSPACE/deluge/theme"
              local theme_url

              theme_url="https://raw.githubusercontent.com/joelacus/deluge-web-dark-theme/$theme_commit/deluge_web_dark_theme.tar.gz"
              mkdir -p "$theme_dir"
              curl --fail --silent --show-error "$theme_url" -o "$archive_file"

              if [[ "$(sha256sum "$archive_file" | awk '{print $1}')" != "$theme_sha256" ]]; then
                  printf '%s\n' 'Deluge theme checksum verification failed' >&2
                  return 1
              fi

              tar -xzf "$archive_file" -C "$theme_dir"
          }

          write_deluge_env() {
              local env_file="$1"
              local config_dir="$2"
              local download_dir="$3"
              local web_port="$4"
              local web_bind_ip="$5"

              printf '%s\n' \
                  'DELUGE_UID=1234' \
                  'DELUGE_GID=1234' \
                  "DELUGE_CONFIG_DIR=$config_dir" \
                  "DOWNLOAD_DIR=$download_dir" \
                  "WEB_PORT=$web_port" \
                  "WEB_BIND_IP=$web_bind_ip" \
                  'TZ=Etc/UTC' \
                  > "$env_file"
          }

          mkdir -p "$smoke_root/lan/config" "$smoke_root/lan/downloads"
          mkdir -p "$smoke_root/vps/config" "$smoke_root/vps/downloads"
          mkdir -p "$smoke_root/plex/config" "$smoke_root/plex/transcode" "$smoke_root/plex/media"
          chmod -R 0777 "$smoke_root"
          prepare_theme

          write_deluge_env \
              "$smoke_root/lan.env" \
              "$smoke_root/lan/config" \
              "$smoke_root/lan/downloads" \
              18112 \
              127.0.0.1
          write_deluge_env \
              "$smoke_root/vps.env" \
              "$smoke_root/vps/config" \
              "$smoke_root/vps/downloads" \
              18113 \
              127.0.0.1

          printf '%s\n' \
              'services:' \
              '  nginx:' \
              '    ports: !override' \
              '      - "127.0.0.1:18080:80"' \
              '      - "127.0.0.1:18443:443"' \
              > "$smoke_root/vps-ports.yml"

          mkdir -p "$GITHUB_WORKSPACE/deluge/nginx/conf.d.runtime" "$GITHUB_WORKSPACE/deluge/nginx/www"
          printf '%s\n' \
              'server {' \
              '    listen 80;' \
              '    server_name _;' \
              '    location / {' \
              '        proxy_pass http://deluge:8112/;' \
              '    }' \
              '}' \
              > "$GITHUB_WORKSPACE/deluge/nginx/conf.d.runtime/00-smoke.conf"

          printf '%s\n' '--- Deluge Home Server smoke ---'
          docker compose -p "$lan_project" --env-file "$smoke_root/lan.env" -f deluge/compose.yml build --pull deluge
          docker compose -p "$lan_project" --env-file "$smoke_root/lan.env" -f deluge/compose.yml up -d
          wait_for_http http://127.0.0.1:18112/ 60 2
          assert_running deluge
          docker compose -p "$lan_project" --env-file "$smoke_root/lan.env" -f deluge/compose.yml down -v --remove-orphans

          printf '%s\n' '--- Deluge VPS + Nginx smoke ---'
          docker compose -p "$vps_project" --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" build --pull
          docker compose -p "$vps_project" --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" up -d
          docker compose -p "$vps_project" --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" exec -T nginx nginx -t
          wait_for_container_http torrentflix-nginx http://deluge:8112/ 60 2
          wait_for_http http://127.0.0.1:18080/ 60 2
          assert_running deluge
          assert_running torrentflix-nginx
          docker compose -p "$vps_project" --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" down -v --remove-orphans

          printf '%s\n' '--- Plex smoke ---'
          PLEX_UID=1234 \
              PLEX_GID=1234 \
              PLEX_CONFIG_DIR="$smoke_root/plex/config" \
              PLEX_TRANSCODE_DIR="$smoke_root/plex/transcode" \
              MEDIA_DIR="$smoke_root/plex/media" \
              PLEX_CLAIM= \
              docker compose -p "$plex_project" -f plex/compose.yml pull plex-server
          PLEX_UID=1234 \
              PLEX_GID=1234 \
              PLEX_CONFIG_DIR="$smoke_root/plex/config" \
              PLEX_TRANSCODE_DIR="$smoke_root/plex/transcode" \
              MEDIA_DIR="$smoke_root/plex/media" \
              PLEX_CLAIM= \
              docker compose -p "$plex_project" -f plex/compose.yml up -d
          wait_for_container_health plex-server 120 5
          wait_for_http http://127.0.0.1:32400/identity 30 2
          assert_running plex-server

      - name: Dump smoke diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          smoke_root="$RUNNER_TEMP/torrentflix-smoke"

          docker compose -p torrentflix-smoke-lan --env-file "$smoke_root/lan.env" -f deluge/compose.yml ps
          docker compose -p torrentflix-smoke-lan --env-file "$smoke_root/lan.env" -f deluge/compose.yml logs --tail=200
          docker compose -p torrentflix-smoke-vps --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" ps
          docker compose -p torrentflix-smoke-vps --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" logs --tail=200
          docker compose -p torrentflix-smoke-plex -f plex/compose.yml ps
          docker compose -p torrentflix-smoke-plex -f plex/compose.yml logs --tail=200

      - name: Clean up smoke resources
        if: always()
        shell: bash
        run: |
          set +e
          smoke_root="$RUNNER_TEMP/torrentflix-smoke"

          docker compose -p torrentflix-smoke-lan --env-file "$smoke_root/lan.env" -f deluge/compose.yml down -v --remove-orphans
          docker compose -p torrentflix-smoke-vps --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" down -v --remove-orphans
          docker compose -p torrentflix-smoke-plex -f plex/compose.yml down -v --remove-orphans
          docker rm -f deluge torrentflix-nginx plex-server 2>/dev/null || true
          sudo rm -rf -- \
              "$smoke_root" \
              deluge/theme \
              deluge/nginx/conf.d.runtime \
              deluge/nginx/www
