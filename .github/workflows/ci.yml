name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code_changed: ${{ steps.changed.outputs.code_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == pull_request ]]; then
              base_sha="$BASE_SHA"
          else
              base_sha="$BEFORE_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse "$HEAD_SHA^")"
          fi

          code_changed=false

          while IFS= read -r changed_file; do
              if [[ "$changed_file" != README.md ]]; then
                  code_changed=true
                  break
              fi
          done < <(git diff --name-only "$base_sha" "$HEAD_SHA")

          printf 'code_changed=%s\n' "$code_changed" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' script_file; do
              shellcheck --severity=error "$script_file"
              bash -n "$script_file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail

          render_compose_json() {
              local compose_file="$1"
              local rendered

              if ! rendered="$(docker compose -f "$compose_file" config --format json 2>&1)"; then
                  printf 'Compose validation failed: %s\n' "$compose_file" >&2
                  printf '%s\n' "$rendered" >&2
                  return 1
              fi

              printf '%s\n' "$rendered"
          }

          assert_compose_json() {
              local description="$1"
              local filter="$2"
              local rendered="$3"

              if jq --exit-status "$filter" <<< "$rendered" >/dev/null; then
                  printf '[validate] %s: ok\n' "$description"
                  return 0
              fi

              printf '[validate] %s: failed\n' "$description" >&2
              jq '.' <<< "$rendered" >&2
              return 1
          }

          deluge_home="$(DELUGE_UID=1234 DELUGE_GID=1234 \
              render_compose_json deluge/compose.yml)"
          deluge_vps="$(render_compose_json deluge/compose.vps.yml)"
          plex_home="$(PLEX_UID=10002 PLEX_GID=10000 \
              render_compose_json plex/compose.yml)"
          plex_vps="$(PLEX_UID=10002 PLEX_GID=10000 \
              render_compose_json plex/compose.vps.yml)"

          assert_compose_json 'Home Server Deluge identity and networking' '
              (.services.deluge.environment.PUID == "1234") and
              (.services.deluge.environment.PGID == "1234") and
              ([.services.deluge.ports[] |
                  select((.target | tonumber) == 8112)] | length == 1) and
              ([.services.deluge.ports[] |
                  select((.target | tonumber) == 6881)] | length == 0) and
              ([.services.deluge.expose[] | tostring |
                  select(. == "6881" or . == "6881/tcp")] | length == 1) and
              ([.services.deluge.expose[] | tostring |
                  select(. == "6881/udp")] | length == 1)
          ' "$deluge_home"

          assert_compose_json 'VPS Deluge identity and internal-only networking' '
              (.services.deluge.environment.PUID == "10001") and
              (.services.deluge.environment.PGID == "10000") and
              ((.services.deluge.ports // []) | length == 0) and
              ([.services.deluge.expose[] | tostring |
                  select(. == "8112" or . == "8112/tcp")] | length == 1) and
              ([.services.deluge.expose[] | tostring |
                  select(. == "6881" or . == "6881/tcp")] | length == 1) and
              ([.services.deluge.expose[] | tostring |
                  select(. == "6881/udp")] | length == 1)
          ' "$deluge_vps"

          assert_compose_json 'Home Server Plex identity, host networking and read-only media' '
              (.services["plex-server"].environment.PLEX_UID == "10002") and
              (.services["plex-server"].environment.PLEX_GID == "10000") and
              (.services["plex-server"].network_mode == "host") and
              ((.services["plex-server"].ports // []) | length == 0) and
              ([.services["plex-server"].volumes[] |
                  select(.target == "/mnt/plexmedia" and .read_only == true)] | length == 1)
          ' "$plex_home"

          assert_compose_json 'VPS Plex identity, ports and read-only media' '
              (.services["plex-server"].environment.PLEX_UID == "10002") and
              (.services["plex-server"].environment.PLEX_GID == "10000") and
              ((.services["plex-server"].network_mode // "") != "host") and
              ([.services["plex-server"].ports[] |
                  select((.target | tonumber) == 32400 and
                      (.published | tonumber) == 32400)] | length == 2) and
              ([.services["plex-server"].ports[] | .protocol] | sort) == ["tcp", "udp"] and
              ([.services["plex-server"].volumes[] |
                  select(.target == "/mnt/plexmedia" and .read_only == true)] | length == 1)
          ' "$plex_vps"

  build:
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    needs:
      - changes
      - validate
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Prepare pinned Deluge theme
        shell: bash
        run: |
          set -euo pipefail
          theme_dir="$RUNNER_TEMP/deluge-theme"
          archive="$RUNNER_TEMP/deluge-theme.tar.gz"
          mkdir -p "$theme_dir"
          curl -fsSL \
            'https://raw.githubusercontent.com/joelacus/deluge-web-dark-theme/dbef18e3c9a2cb0f2448d16bb95dca868f94440e/deluge_web_dark_theme.tar.gz' \
            -o "$archive"
          printf '%s  %s\n' \
            '5c3e6a4453fb06c16bc89f3b3789f12ba56b01addc111477211cb63e93f291bb' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$theme_dir"
          cp -a "$theme_dir" deluge/theme

      - name: Build Deluge image
        run: docker build --pull -f deluge/Dockerfile -t torrentflix-ci-deluge deluge

      - name: Build bundled Nginx image
        run: docker build --pull -f deluge/nginx/Dockerfile -t torrentflix-ci-nginx deluge/nginx

  smoke:
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    needs:
      - changes
      - validate
      - build
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run container smoke tests
        shell: bash
        run: |
          set -euo pipefail

          smoke_root="$RUNNER_TEMP/torrentflix-smoke"
          lan_project='torrentflix-smoke-lan'
          vps_project='torrentflix-smoke-vps'
          plex_project='torrentflix-smoke-plex'
          theme_commit='dbef18e3c9a2cb0f2448d16bb95dca868f94440e'
          theme_sha256='5c3e6a4453fb06c16bc89f3b3789f12ba56b01addc111477211cb63e93f291bb'

          wait_for_http() {
              local container_name="$1"
              local url="$2"
              local attempts="$3"
              local delay="$4"
              local attempt
              local curl_exit
              local status

              for ((attempt = 1; attempt <= attempts; attempt++)); do
                  if status="$(curl \
                      --silent \
                      --show-error \
                      --connect-timeout 2 \
                      --max-time 5 \
                      --output /dev/null \
                      --write-out '%{http_code}' \
                      "$url")"; then
                      curl_exit=0
                  else
                      curl_exit=$?
                  fi

                  printf '[smoke] GET %s -> HTTP %s, curl exit %s (attempt %s/%s)\n' \
                      "$url" "${status:-000}" "$curl_exit" "$attempt" "$attempts"

                  if [[ "$curl_exit" -eq 0 && "$status" =~ ^[23][0-9]{2}$ ]]; then
                      return 0
                  fi

                  if ! container_is_running "$container_name"; then
                      printf 'Container stopped before HTTP readiness: %s\n' \
                          "$container_name" >&2
                      return 1
                  fi

                  sleep "$delay"
              done

              return 1
          }

          wait_for_container_http() {
              local probe_container="$1"
              local target_container="$2"
              local url="$3"
              local attempts="$4"
              local delay="$5"
              local attempt
              local curl_exit
              local status

              for ((attempt = 1; attempt <= attempts; attempt++)); do
                  if status="$(docker exec "$probe_container" \
                      curl \
                      --silent \
                      --show-error \
                      --connect-timeout 2 \
                      --max-time 5 \
                      --output /dev/null \
                      --write-out '%{http_code}' \
                      "$url")"; then
                      curl_exit=0
                  else
                      curl_exit=$?
                  fi

                  printf '[smoke] GET %s via %s -> HTTP %s, curl exit %s (attempt %s/%s)\n' \
                      "$url" "$probe_container" "${status:-000}" "$curl_exit" \
                      "$attempt" "$attempts"

                  if [[ "$curl_exit" -eq 0 && "$status" =~ ^[23][0-9]{2}$ ]]; then
                      return 0
                  fi

                  if ! container_is_running "$probe_container"; then
                      printf 'Probe container stopped before HTTP readiness: %s\n' \
                          "$probe_container" >&2
                      return 1
                  fi

                  if ! container_is_running "$target_container"; then
                      printf 'Target container stopped before HTTP readiness: %s\n' \
                          "$target_container" >&2
                      return 1
                  fi

                  sleep "$delay"
              done

              return 1
          }

          container_is_running() {
              local container_name="$1"
              local running

              if ! running="$(docker inspect --format '{{.State.Running}}' \
                  "$container_name" 2>/dev/null)"; then
                  return 1
              fi

              [[ "$running" == true ]]
          }

          wait_for_container_health() {
              local container_name="$1"
              local attempts="$2"
              local delay="$3"
              local health_status
              local attempt

              for ((attempt = 1; attempt <= attempts; attempt++)); do
                  if ! container_is_running "$container_name"; then
                      printf 'Container stopped before health readiness: %s\n' \
                          "$container_name" >&2
                      return 1
                  fi

                  if ! health_status="$(docker inspect \
                      --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                      "$container_name" 2>/dev/null)"; then
                      printf 'Unable to inspect container health: %s\n' \
                          "$container_name" >&2
                      return 1
                  fi
                  printf '[smoke] %s health -> %s (attempt %s/%s)\n' \
                      "$container_name" "$health_status" "$attempt" "$attempts"

                  if [[ "$health_status" == healthy ]]; then
                      return 0
                  fi

                  sleep "$delay"
              done

              printf 'Container did not become healthy: %s (%s)\n' \
                  "$container_name" "$health_status" >&2
              return 1
          }

          assert_running() {
              local container_name="$1"
              local container_state
              local exit_code
              local running
              local restart_count

              container_state="$(docker inspect \
                  --format '{{.State.Running}} {{.RestartCount}} {{.State.ExitCode}}' \
                  "$container_name")"
              read -r running restart_count exit_code <<< "$container_state"

              if [[ "$running" != true ]]; then
                  printf 'Container is not running: %s (exit %s)\n' \
                      "$container_name" "$exit_code" >&2
                  return 1
              fi

              if [[ "$restart_count" != 0 ]]; then
                  printf 'Container restarted during smoke test: %s (%s)\n' "$container_name" "$restart_count" >&2
                  return 1
              fi
          }

          assert_published_ports() {
              local container_name="$1"
              local expected_ports="$2"
              local inspected

              inspected="$(docker inspect "$container_name")"

              if jq --exit-status --argjson expected "$expected_ports" '
                  ([((.[0].NetworkSettings.Ports // {}) | to_entries[]) |
                      select(.value != null) | .key] | sort) == ($expected | sort)
              ' <<< "$inspected" >/dev/null; then
                  printf '[smoke] %s published ports match %s\n' \
                      "$container_name" "$expected_ports"
                  return 0
              fi

              printf 'Unexpected published ports for %s\n' "$container_name" >&2
              docker port "$container_name" >&2
              return 1
          }

          assert_read_only_mount() {
              local container_name="$1"
              local destination="$2"
              local inspected

              inspected="$(docker inspect "$container_name")"

              if jq --exit-status --arg destination "$destination" '
                  [.[0].Mounts[] |
                      select(.Destination == $destination and .RW == false)] | length == 1
              ' <<< "$inspected" >/dev/null; then
                  printf '[smoke] %s mount %s is read-only\n' \
                      "$container_name" "$destination"
                  return 0
              fi

              printf 'Mount is missing or writable: %s:%s\n' \
                  "$container_name" "$destination" >&2
              return 1
          }

          prepare_theme() {
              local archive_file="$RUNNER_TEMP/deluge-theme.tar.gz"
              local theme_dir="$GITHUB_WORKSPACE/deluge/theme"
              local theme_url

              theme_url="https://raw.githubusercontent.com/joelacus/deluge-web-dark-theme/$theme_commit/deluge_web_dark_theme.tar.gz"
              mkdir -p "$theme_dir"
              curl --fail --silent --show-error "$theme_url" -o "$archive_file"

              if ! printf '%s  %s\n' "$theme_sha256" "$archive_file" | \
                  sha256sum --check --status; then
                  printf '%s\n' 'Deluge theme checksum verification failed' >&2
                  return 1
              fi

              tar -xzf "$archive_file" -C "$theme_dir"
          }

          write_deluge_env() {
              local env_file="$1"
              local config_dir="$2"
              local download_dir="$3"
              local web_port="$4"
              local web_bind_ip="$5"

              printf '%s\n' \
                  'DELUGE_UID=1234' \
                  'DELUGE_GID=1234' \
                  "DELUGE_CONFIG_DIR=$config_dir" \
                  "DOWNLOAD_DIR=$download_dir" \
                  "WEB_PORT=$web_port" \
                  "WEB_BIND_IP=$web_bind_ip" \
                  'TZ=Etc/UTC' \
                  > "$env_file"
          }

          mkdir -p "$smoke_root/lan/config" "$smoke_root/lan/downloads"
          mkdir -p "$smoke_root/vps/config" "$smoke_root/vps/downloads"
          mkdir -p "$smoke_root/plex/config" "$smoke_root/plex/transcode" "$smoke_root/plex/media"
          sudo chown -R 1234:1234 \
              "$smoke_root/lan" \
              "$smoke_root/vps" \
              "$smoke_root/plex"
          sudo chmod -R u+rwX,go-rwx \
              "$smoke_root/lan" \
              "$smoke_root/vps" \
              "$smoke_root/plex"
          prepare_theme

          write_deluge_env \
              "$smoke_root/lan.env" \
              "$smoke_root/lan/config" \
              "$smoke_root/lan/downloads" \
              18112 \
              127.0.0.1
          write_deluge_env \
              "$smoke_root/vps.env" \
              "$smoke_root/vps/config" \
              "$smoke_root/vps/downloads" \
              18113 \
              127.0.0.1

          printf '%s\n' \
              'services:' \
              '  nginx:' \
              '    ports: !override' \
              '      - "127.0.0.1:18080:80"' \
              '      - "127.0.0.1:18443:443"' \
              > "$smoke_root/vps-ports.yml"

          mkdir -p "$GITHUB_WORKSPACE/deluge/nginx/conf.d.runtime" "$GITHUB_WORKSPACE/deluge/nginx/www"
          printf '%s\n' \
              'server {' \
              '    listen 80;' \
              '    server_name _;' \
              '    location / {' \
              '        proxy_pass http://deluge:8112/;' \
              '    }' \
              '}' \
              > "$GITHUB_WORKSPACE/deluge/nginx/conf.d.runtime/00-smoke.conf"

          printf '%s\n' '--- Deluge Home Server smoke ---'
          docker compose -p "$lan_project" --env-file "$smoke_root/lan.env" -f deluge/compose.yml build --pull deluge
          docker compose -p "$lan_project" --env-file "$smoke_root/lan.env" -f deluge/compose.yml up -d
          wait_for_http deluge http://127.0.0.1:18112/ 60 2
          assert_running deluge
          assert_published_ports deluge '["8112/tcp"]'
          docker compose -p "$lan_project" --env-file "$smoke_root/lan.env" -f deluge/compose.yml down -v --remove-orphans

          printf '%s\n' '--- Deluge VPS + Nginx smoke ---'
          docker compose -p "$vps_project" --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" build --pull
          docker compose -p "$vps_project" --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" up -d
          docker compose -p "$vps_project" --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" exec -T nginx nginx -t
          wait_for_container_http torrentflix-nginx deluge http://deluge:8112/ 60 2
          wait_for_http torrentflix-nginx http://127.0.0.1:18080/ 60 2
          assert_running deluge
          assert_running torrentflix-nginx
          assert_published_ports deluge '[]'
          assert_published_ports torrentflix-nginx '["443/tcp", "80/tcp"]'
          docker compose -p "$vps_project" --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" down -v --remove-orphans

          printf '%s\n' '--- Plex smoke ---'
          PLEX_UID=1234 \
              PLEX_GID=1234 \
              PLEX_CONFIG_DIR="$smoke_root/plex/config" \
              PLEX_TRANSCODE_DIR="$smoke_root/plex/transcode" \
              MEDIA_DIR="$smoke_root/plex/media" \
              PLEX_CLAIM= \
              PLEX_BIND_IP=127.0.0.1 \
              PLEX_PORT=32400 \
              docker compose -p "$plex_project" -f plex/compose.vps.yml pull plex-server
          PLEX_UID=1234 \
              PLEX_GID=1234 \
              PLEX_CONFIG_DIR="$smoke_root/plex/config" \
              PLEX_TRANSCODE_DIR="$smoke_root/plex/transcode" \
              MEDIA_DIR="$smoke_root/plex/media" \
              PLEX_CLAIM= \
              PLEX_BIND_IP=127.0.0.1 \
              PLEX_PORT=32400 \
              docker compose -p "$plex_project" -f plex/compose.vps.yml up -d
          wait_for_container_health plex-server 120 5
          wait_for_http plex-server http://127.0.0.1:32400/identity 30 2
          assert_running plex-server
          assert_published_ports plex-server '["32400/tcp", "32400/udp"]'
          assert_read_only_mount plex-server /mnt/plexmedia

      - name: Dump smoke diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          smoke_root="$RUNNER_TEMP/torrentflix-smoke"

          docker compose -p torrentflix-smoke-lan --env-file "$smoke_root/lan.env" -f deluge/compose.yml ps
          docker compose -p torrentflix-smoke-lan --env-file "$smoke_root/lan.env" -f deluge/compose.yml logs --tail=200
          docker compose -p torrentflix-smoke-vps --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" ps
          docker compose -p torrentflix-smoke-vps --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" logs --tail=200
          docker compose -p torrentflix-smoke-plex -f plex/compose.vps.yml ps
          docker compose -p torrentflix-smoke-plex -f plex/compose.vps.yml logs --tail=200

      - name: Clean up smoke resources
        if: always()
        shell: bash
        run: |
          set +e
          smoke_root="$RUNNER_TEMP/torrentflix-smoke"

          docker compose -p torrentflix-smoke-lan --env-file "$smoke_root/lan.env" -f deluge/compose.yml down -v --remove-orphans
          docker compose -p torrentflix-smoke-vps --env-file "$smoke_root/vps.env" -f deluge/compose.vps.yml -f "$smoke_root/vps-ports.yml" down -v --remove-orphans
          docker compose -p torrentflix-smoke-plex -f plex/compose.vps.yml down -v --remove-orphans
          docker rm -f deluge torrentflix-nginx plex-server 2>/dev/null || true
          sudo rm -rf -- \
              "$smoke_root" \
              deluge/theme \
              deluge/nginx/conf.d.runtime \
              deluge/nginx/www
