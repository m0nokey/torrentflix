services:
  plex-server:
    container_name: plex-server
    image: ${PLEX_IMAGE:-plexinc/pms-docker:1.43.3.10861-07dfddaeb@sha256:5bc1d13f48da6366f46aaf2a3ce1a6292897eadc1f8efcbbd7321d30e94f2ed4}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      PLEX_UID: ${PLEX_UID:-10002}
      PLEX_GID: ${PLEX_GID:-10000}
    network_mode: host
    volumes:
      - ${PLEX_CONFIG_DIR:-/opt/torrentflix/plex/config}:/config
      - ${PLEX_TRANSCODE_DIR:-/opt/torrentflix/plex/transcode}:/transcode
      - ${MEDIA_DIR:-/srv/torrentflix/media}:/mnt/plexmedia

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m

    security_opt:
      - no-new-privileges:true

    mem_limit: ${PLEX_MEM_LIMIT:-4g}
    mem_reservation: ${PLEX_MEM_RESERVATION:-512m}
    cpus: ${PLEX_CPUS:-2.0}
    pids_limit: ${PLEX_PIDS_LIMIT:-512}
